name: inkling
description: "Inkling - a little ink for every day. A cosy daily diary."
publish_to: 'none'

# versionName+versionCode. Bump both for every release you hand out, the
# in-app update checker compares versionName against GitHub release tags.
version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  sqflite: ^2.4.5
  path: ^1.9.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  home_widget: ^0.10.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  local_auth: ^3.0.2
  file_picker: ^13.2.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  http: ^1.6.0
  url_launcher: ^6.3.3
  dynamic_color: ^2.1.0
  quick_actions: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/

  # All fonts are bundled (SIL Open Font License) so the app looks right offline.
  fonts:
    # Fraunces with its SOFT and WONK axes turned up: rounder, friendlier headlines.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    # Rounded UI font.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
